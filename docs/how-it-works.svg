<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1000" height="400" rx="22" fill="#0b1020"/><rect x="24" y="24" width="460" height="310" rx="18" fill="#141b2d" stroke="#ff6b6b" stroke-opacity="0.55" stroke-width="2"/><text x="48" y="62" font-size="22" fill="#ff6b6b" font-weight="bold" text-anchor="start">Without SplitGate</text><rect x="54" y="108" width="44" height="76" rx="9" fill="none" stroke="#9fb0d6" stroke-width="3"/><rect x="69" y="116" width="14" height="4" rx="2" fill="#9fb0d6"/><text x="76" y="208" font-size="14" fill="#9fb0d6" font-weight="normal" text-anchor="middle">Phone</text><rect x="134" y="128" width="190" height="36" rx="8" fill="#0b1020" stroke="#9fb0d6" stroke-width="2"/><text x="229" y="152" font-size="18" fill="#ff6b6b" font-weight="bold" text-anchor="middle">discord.com</text><text x="229" y="188" font-size="13" fill="#9fb0d6" font-weight="normal" text-anchor="middle">the site name is readable</text><path d="M102 146 H130" stroke="#9fb0d6" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><rect x="48" y="232" width="260" height="46" rx="12" fill="#0b1020" stroke="#ff6b6b" stroke-width="2"/><text x="178" y="261" font-size="15" fill="#eaf0ff" font-weight="bold" text-anchor="middle">Filter (DPI) reads the name</text><circle cx="396" cy="252" r="22" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-width="3"/><path d="M388 244 l16 16 M404 244 l-16 16" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round"/><text x="396" y="302" font-size="15" fill="#ff6b6b" font-weight="bold" text-anchor="middle">Blocked</text><rect x="516" y="24" width="460" height="310" rx="18" fill="#141b2d" stroke="#2ee6a8" stroke-opacity="0.55" stroke-width="2"/><text x="540" y="62" font-size="22" fill="#2ee6a8" font-weight="bold" text-anchor="start">With SplitGate</text><rect x="546" y="108" width="44" height="76" rx="9" fill="none" stroke="#9fb0d6" stroke-width="3"/><rect x="561" y="116" width="14" height="4" rx="2" fill="#9fb0d6"/><text x="568" y="208" font-size="14" fill="#9fb0d6" font-weight="normal" text-anchor="middle">Phone</text><rect x="626" y="128" width="78" height="36" rx="8" fill="#0b1020" stroke="#2ee6a8" stroke-width="2"/><text x="665" y="152" font-size="18" fill="#2ee6a8" font-weight="bold" text-anchor="middle">disco</text><rect x="726" y="128" width="96" height="36" rx="8" fill="#0b1020" stroke="#2ee6a8" stroke-width="2"/><text x="774" y="152" font-size="18" fill="#2ee6a8" font-weight="bold" text-anchor="middle">rd.com</text><text x="721" y="188" font-size="13" fill="#9fb0d6" font-weight="normal" text-anchor="middle">cut in pieces</text><path d="M594 146 H622" stroke="#9fb0d6" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><rect x="540" y="232" width="260" height="46" rx="12" fill="#0b1020" stroke="#2ee6a8" stroke-width="2"/><text x="670" y="261" font-size="15" fill="#eaf0ff" font-weight="bold" text-anchor="middle">Filter sees only fragments</text><circle cx="888" cy="252" r="22" fill="#2ee6a8" fill-opacity="0.18" stroke="#2ee6a8" stroke-width="3"/><path d="M876 253 l9 10 l17 -20" fill="none" stroke="#2ee6a8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="888" y="302" font-size="15" fill="#2ee6a8" font-weight="bold" text-anchor="middle">Opens</text><text x="500" y="372" font-size="16" fill="#9fb0d6" font-weight="normal" text-anchor="middle">DNS goes over encrypted DoH, so a poisoned DNS answer cannot send you to a fake address.</text></svg>
